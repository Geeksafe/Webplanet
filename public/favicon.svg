<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pix-fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="pix-fav-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="pix-fav-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Rounded Badge -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#pix-fav-bg)" filter="url(#pix-fav-glow)" />

  <!-- 4 Printing / Pixel Blocks -->
  <!-- Top Left: Bright White -->
  <rect x="15" y="15" width="14" height="14" rx="3.5" fill="#ffffff" />
  <!-- Top Right: Cyan Glow -->
  <rect x="33" y="15" width="14" height="14" rx="3.5" fill="url(#pix-fav-cyan)" />
  <!-- Bottom Left: White 90% -->
  <rect x="15" y="33" width="14" height="14" rx="3.5" fill="#ffffff" fill-opacity="0.9" />
  <!-- Bottom Right: Vibrant Sky Blue -->
  <rect x="33" y="33" width="14" height="14" rx="3.5" fill="#38bdf8" />

  <!-- Spark Accent Dot -->
  <circle cx="50" cy="14" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
</svg>